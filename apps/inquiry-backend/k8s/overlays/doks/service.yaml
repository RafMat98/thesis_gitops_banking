apiVersion: v1
kind: Service
metadata:
  name: inquiry-backend-service
  namespace: banking-apps
  labels:
    app: inquiry-backend
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: "inquiry-backend-lb"
    service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-check-interval-seconds: "10"
spec:
  type: LoadBalancer
  selector:
    app: inquiry-backend
  ports:
    - name: java-http-metrics
      protocol: TCP
      port: 80
      targetPort: 8080
