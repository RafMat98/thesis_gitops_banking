apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-api-ingress
  namespace: banking-system
spec:
  ingressClassName: nginx
  rules:
    - host: kafka.local # 1 : Το Domain
      http:
        paths:
          - path: /api/v1/balance # 2: Το Path
            pathType: Prefix
            backend:
              service:
                name: inquiry-backend-service # 3: Ο Προορισμός
                port:
                  number: 80
