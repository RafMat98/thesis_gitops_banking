apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ibm-interface-hpa
  namespace: banking-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ibm-interface
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # if traffic exceeds 70% of the 200m (limit), it triggers scale up
