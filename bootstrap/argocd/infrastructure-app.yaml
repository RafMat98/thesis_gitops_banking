apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # Ensure this application is synced before the monitoring configuration and IBM interface
spec:
  project: default
  source:
    repoURL: "https://github.com/RafMat98/thesis_gitops_banking.git"
    targetRevision: development
    path: infrastructure/kafka
  destination:
    server: "https://kubernetes.default.svc"
    namespace: infra-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
