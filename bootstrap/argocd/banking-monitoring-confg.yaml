apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-monitoring-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USER/banking_thesis.git
    targetRevision: development
    path: infrastructure/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
