apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailer-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # Ensure this application is synced after the Kafka cluster, monitoring configuration, and IBM interface are set up
spec:
  project: default
  source:
    repoURL: "https://github.com/RafMat98/thesis_gitops_banking.git"
    targetRevision: development
    path: apps/mailer-service/k8s/overlays/keda
  destination:
    server: "https://kubernetes.default.svc"
    namespace: banking-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: go-mailer-service
      jsonPointers:
        - /spec/replicas
