apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mailer-service-egress
  namespace: banking-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      app: go-mailer-service # <--- ΠΡΟΣΟΧΗ: Βεβαιώσου ότι αυτό είναι το σωστό label σου!

  egress:
    # 1. Πρόσβαση στο CoreDNS (Απαραίτητο για το DNS resolution)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"

    # 3. Πρόσβαση στο Mailpit (Για να στείλει τα emails και να κάνει commit!)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": infra-system
            app: mailpit # <--- Βεβαιώσου ότι το pod του Mailpit έχει αυτό το label
      toPorts:
        - ports:
            - port: "1025"
              protocol: TCP # Το SMTP τρέχει μόνο πάνω από TCP
