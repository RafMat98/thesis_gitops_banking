apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailer-service-egress
  namespace: banking-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app: go-mailer-service # <-- (Σιγουρέψου ότι αυτό είναι το σωστό label του pod σου!)
  policyTypes:
    - Egress
  egress:
    # 1. Πρόσβαση στο Mailpit (SMTP)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-system
          podSelector:
            matchLabels:
              app: mailpit
      ports:
        # Το SMTP χρησιμοποιεί μόνο TCP, το UDP δεν χρειάζεται καν, αλλά δεν βλάπτει!
        - protocol: TCP
          port: 1025

    # 2. Πρόσβαση στο CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # 3. Πρόσβαση στον Kafka Broker (ΤΟ ΚΡΙΣΙΜΟ ΚΟΜΜΑΤΙ)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-system
          podSelector:
            matchLabels:
              strimzi.io/cluster: main-cluster
      ports:
        - protocol: TCP
          port: 9093
