apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mailer-service-egress
  namespace: banking-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      app: go-mailer-service

  egress:
    # 1.CoreDNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"

    # 2. Mailpit
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": infra-system
            app: mailpit
      toPorts:
        - ports:
            - port: "1025"
              protocol: TCP
