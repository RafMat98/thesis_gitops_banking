apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-egress-to-kafka
  namespace: keda
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app: keda-operator

  policyTypes:
    - Egress
  egress:
    # 1. Kafka Cluster (Strimzi)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-system
          podSelector:
            matchLabels:
              strimzi.io/cluster: main-cluster
      ports:
        - protocol: TCP
          port: 9093

    # 2. Kubernetes API Server (Required for all the Operators)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443

    # 3.CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # Επιτρέπει την έξοδο προς οποιαδήποτε IP (εσωτερική ή εξωτερική)...
      ports:
        - protocol: TCP
          port: 443
