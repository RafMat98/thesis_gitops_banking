apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-egress-to-kafka
  namespace: keda
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      app: keda-operator

  egress:
    # 1.Entity Cilium
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # 2. CoreDNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY

    # 3. Kafka Broker (Strimzi)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": infra-system
            strimzi.io/cluster: main-cluster
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP

    # 4. Internet Access (Optional, if KEDA needs to access external services)
    # - toEntities:
    #     - world
    #   toPorts:
    #     - ports:
    #         - port: "443"
    #           protocol: TCP
