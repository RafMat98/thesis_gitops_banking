apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inquiry-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/RafMat98/thesis_gitops_banking.git"
    targetRevision: development
    path: apps/inquiry-backend/k8s
  destination:
    server: "https://kubernetes.default.svc"
    namespace: banking-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
