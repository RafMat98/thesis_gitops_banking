apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scripts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # Ensure this application is synced before any applications that depend on the scripts
spec:
  project: default
  source:
    repoURL: "https://github.com/RafMat98/thesis_gitops_banking.git"
    targetRevision: development
    path: scripts/
  destination:
    server: "https://kubernetes.default.svc"
    namespace: infra-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
