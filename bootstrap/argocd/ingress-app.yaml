apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Ξεκινάει ΠΡΩΤΟ
spec:
  project: default
  source:
    repoURL: "https://kubernetes.github.io/ingress-nginx"
    targetRevision: 4.15.1
    chart: ingress-nginx
    helm:
      values: |
        controller:
          hostNetwork: false       
          hostPort:
            enabled: false
          service:
            type: NodePort
            nodePorts:
              http: 31000
              https: 30443
          replicaCount: 2
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
