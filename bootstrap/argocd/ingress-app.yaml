apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Ξεκινάει ΠΡΩΤΟ
spec:
  project: default
  source:
    repoURL: "https://kubernetes.github.io/ingress-nginx"
    targetRevision: 4.15.1
    chart: ingress-nginx
    helm:
      values: |
        controller:
          publishService:
            enabled: true
            type: LoadBalancer
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
