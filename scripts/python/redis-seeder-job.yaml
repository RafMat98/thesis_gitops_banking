apiVersion: batch/v1
kind: Job
metadata:
  name: redis-bulk-seeder
  namespace: infra-system
spec:
  template:
    spec:
      containers:
        - name: redis-bulk-seeder
          annotations:
            argocd.argoproj.io/hook: Sync
            argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
          image: rmat98/redis-seeder:v1.0.0
          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: host
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
      restartPolicy: Never
  backoffLimit: 4
