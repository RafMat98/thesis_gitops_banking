apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: main-cluster
  namespace: infra-system
  annotations:
    strimzi.io/node-pools: enabled # Enable Connector resources
spec:
  kafka:
    version: 4.2.0
    metadataVersion: "4.2-IV0"
    #  # --- Using reflector annotations to allow secure sharing of the cluster CA certificate with the banking-apps namespace ---
    template:
      clusterCaCert:
        metadata:
          annotations:
            reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
            reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "banking-apps"
            reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls # mTLS Authentication
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "4.2.0"

  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
