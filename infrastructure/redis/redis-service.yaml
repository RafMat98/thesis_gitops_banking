apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: infra-system
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
    # nodePort: 30080
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  namespace: infra-system
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 5540
      nodePort: 30079
  selector:
    app: redis-insight
