apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: infra-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21.0
          ports:
            - containerPort: 1025
            - containerPort: 8025
          env:
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mailer-smtp-secret
                  key: smtp-username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mailer-smtp-secret
                  key: smtp-password
            - name: MP_SMTP_AUTH
              value: "$(SMTP_USERNAME):$(SMTP_PASSWORD)"
            - name: MP_SMTP_TLS_CERT
              value: "/certs/tls.crt"
            - name: MP_SMTP_TLS_KEY
              value: "/certs/tls.key"
            - name: MP_MAX_MESSAGES
              value: "10000"
          volumeMounts:
            - name: tls-volume
              mountPath: "/certs"
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 8025
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8025
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tls-volume
          secret:
            secretName: mailpit-tls-secret
