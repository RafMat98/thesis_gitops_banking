apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-comparison-dashboard
  namespace: monitoring-system
  labels:
    grafana_dashboard: "1"
data:
  keda-vs-hpa-unified.json: |-
    {
      "title": "Banking Microservices: Unified Scaling Analysis",
      "timezone": "browser",
      "panels": [
        {
          "type": "row",
          "title": "System Metrics: Java Spring Boot Service (Ingress)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "title": "CPU Usage vs Limit (%)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "targets": [
            { "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace='banking-apps', pod=~'inquiry-backend-.*'}) / sum(kube_pod_container_resource_limits{resource='cpu', namespace='banking-apps', pod=~'inquiry-backend-.*'}) * 100", "legendFormat": "CPU Load" }
          ],
          "fieldConfig": { "defaults": { "min": 0, "max": 100, "unit": "percent", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 80 } ] } } }
        },
        {
          "title": "Cluster Infrastructure: Active Nodes",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 60 },
          "targets": [
            { 
              "expr": "sum(kube_node_status_condition{condition='Ready', status='true'})", 
              "legendFormat": "Ready Nodes" 
            },
            { 
              "expr": "count(kube_node_info)", 
              "legendFormat": "Total Nodes" 
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "type": "row",
          "title": "System Metrics: Ibmi Interface Service (Legacy Backend)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "collapsed": false
        },
        {
          "title": "Kafka Ingress Lag (Ibmi Interface Service)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 10 },
          "targets": [
            { "expr": "sum(kafka_consumergroup_lag{consumergroup='cobol-backend-group', topic='balance-requests'}) or vector(0)", "legendFormat": "Messages Waiting in Kafka" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "area", "fillOpacity": 20 } } }
        },
        {
          "title": "System Response: Active Replicas",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "targets": [
            { "expr": "kube_deployment_status_replicas_available{deployment='ibm-interface'}", "legendFormat": "Current Running Pods" },
            { "expr": "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler='keda-hpa-ibm-interface-scaledobject'}", "legendFormat": "HPA Desired Level" },
            { "expr": "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler='ibm-interface-hpa'}", "legendFormat": "HPA Desired Level" }
          ]
        },
        {
          "title": "CPU Usage vs Limit (%)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "targets": [
            { "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace='banking-apps', pod=~'ibm-interface-.*'}) / sum(kube_pod_container_resource_limits{resource='cpu', namespace='banking-apps', pod=~'ibm-interface-.*'}) * 100", "legendFormat": "CPU Load" }
          ],
          "fieldConfig": { "defaults": { "min": 0, "max": 100, "unit": "percent", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 80 } ] } } }
        },

        {
          "type": "row",
          "title": "System Metrics: Go Profile Service",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 },
          "collapsed": false
        },
        {
          "title": "Kafka Ingress Lag (Profile Service)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 27 },
          "targets": [
            { "expr": "sum(kafka_consumergroup_lag{consumergroup='go-microservice-group', topic='balance-responses'}) or vector(0)", "legendFormat": "Messages Waiting in Kafka" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "area", "fillOpacity": 20 } } }
        },
        {
          "title": "System Response: Active Replicas",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 35 },
          "targets": [
            { "expr": "kube_deployment_status_replicas_available{deployment='go-profile-service'}", "legendFormat": "Current Running Pods" },
            { "expr": "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=~'keda-hpa-.*profile.*|profile-hpa'}", "legendFormat": "HPA Desired Level" }
          ]
        },
        {
          "title": "CPU Usage vs Limit (%)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 35 },
          "targets": [
            { "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace='banking-apps', pod=~'go-profile-service-.*'}) / sum(kube_pod_container_resource_limits{resource='cpu', namespace='banking-apps', pod=~'go-profile-service-.*'}) * 100", "legendFormat": "CPU Load" }
          ],
          "fieldConfig": { "defaults": { "min": 0, "max": 100, "unit": "percent", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 80 } ] } } }
        },

        {
          "type": "row",
          "title": "System Metrics: Go Mailer Service",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 43 },
          "collapsed": false
        },
        {
          "title": "Kafka Ingress Lag (The Cause)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 44 },
          "targets": [
            { "expr": "sum(kafka_consumergroup_lag{consumergroup='go-mailer-group', topic='profile-updates'}) or vector(0)", "legendFormat": "Messages Waiting in Kafka" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "area", "fillOpacity": 20 } } }
        },
        {
          "title": "System Response: Active Replicas",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 52 },
          "targets": [
            { "expr": "kube_deployment_status_replicas_available{deployment='go-mailer-service'}", "legendFormat": "Current Running Pods" },
            { "expr": "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler='keda-hpa-mailer-kafka-scaler'}", "legendFormat": "HPA Desired Level" },
            { "expr": "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler='mailer-hpa'}", "legendFormat": "HPA Desired Level" }
          ]
        },
        {
          "title": "CPU Usage vs Limit (%)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 52 },
          "targets": [
            { "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace='banking-apps', pod=~'go-mailer-service-.*'}) / sum(kube_pod_container_resource_limits{resource='cpu', namespace='banking-apps', pod=~'go-mailer-service-.*'}) * 100", "legendFormat": "CPU Load" }
          ],
          "fieldConfig": { "defaults": { "min": 0, "max": 100, "unit": "percent", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 80 } ] } } }
        },
        {
          "title": "Java Spring Boot Service: Api Requests",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 60 },
          "targets": [
            { "expr": "sum(max_over_time(inquiry_requests_total[15m]))", "legendFormat": "Api Requests" }
          ]
        },
        {
          "title": "Go Mailer Service: Mails Sent",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 60 },
          "targets": [
            { "expr": "sum(max_over_time(go_emails_processed_total{status=\"success\"}[15m]))", "legendFormat": "Mails Sent" }
          ]
        }
      ]
    }
