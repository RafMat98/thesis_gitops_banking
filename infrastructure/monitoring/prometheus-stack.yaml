apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keda-metrics-monitor
  namespace: monitoring-system
  labels:
    release: kube-prometheus-stack

spec:
  selector:
    matchLabels:
      app: keda-operator-metrics-apiserver

  namespaceSelector:
    matchNames:
      - keda

  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scheme: http
