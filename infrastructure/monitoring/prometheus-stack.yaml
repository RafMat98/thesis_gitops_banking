apiVersion: v1
kind: Service
metadata:
  name: main-cluster-kafka-exporter
  namespace: infra-system
  labels:
    strimzi.io/cluster: main-cluster
    strimzi.io/name: main-cluster-kafka-exporter
spec:
  selector:
    strimzi.io/name: main-cluster-kafka-exporter
  ports:
    - name: tcp-prometheus
      port: 9404
      targetPort: 9404

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: strimzi-kafka-exporter-monitor
  namespace: monitoring-system
  labels:
    release: kube-prometheus-stack # Το κλειδί για τον Operator
spec:
  selector:
    matchLabels:
      strimzi.io/name: main-cluster-kafka-exporter # Στοχεύει το Service που φτιάξαμε ακριβώς από πάνω
  namespaceSelector:
    matchNames:
      - infra-system
  endpoints:
    - port: tcp-prometheus # Το όνομα της θύρας που ορίσαμε
      path: /metrics
      interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-backend-monitor
  namespace: monitoring-system
spec:
  selector:
    matchLabels:
      app: inquiry-backend
  namespaceSelector:
    matchNames:
      - banking-apps
  endpoints:
    - port: java-http-metrics
      path: /actuator/prometheus
      interval: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-backend-monitor
  namespace: monitoring-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: mailer-service
  namespaceSelector:
    matchNames:
      - banking-apps
  endpoints:
    - port: go-http-metrics
      path: /metrics
      interval: 5s
