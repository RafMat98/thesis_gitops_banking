apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keda-metrics-monitor
  namespace: monitoring-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keda-operator-metrics-apiserver
  namespaceSelector:
    matchNames:
      - keda
  endpoints:
    - port: metrics-api
      path: /metrics
      interval: 5s
      scheme: http
